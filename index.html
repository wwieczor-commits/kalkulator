<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kalkulator prowizji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: jedna kolumna jak notes rozliczeń; lepki pasek z sumą u góry, przycisk dodawania przy dolnej krawędzi */
:root{
  --bg:#f3f5f2; --card:#ffffff; --ink:#17251e; --muted:#5d6d64; --line:#dde4de;
  --accent:#1f6b4f; --accent-ink:#ffffff; --accent-soft:#e3efe8; --danger:#b23a2b; --danger-soft:#f8e5e1;
  --field:#f7f9f7;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111814; --card:#18221d; --ink:#e6eee9; --muted:#97a89e; --line:#2a3731;
  --accent:#4fb889; --accent-ink:#0b1510; --accent-soft:#1d3329; --danger:#f08a7a; --danger-soft:#3a201b;
  --field:#141d18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --card:#18221d; --ink:#e6eee9; --muted:#97a89e; --line:#2a3731;
  --accent:#4fb889; --accent-ink:#0b1510; --accent-soft:#1d3329; --danger:#f08a7a; --danger-soft:#3a201b;
  --field:#141d18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* pasek podsumowania */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.top-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.total{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1.1;margin-top:2px}
.top-meta{font-size:12.5px;opacity:.85;text-align:right}
.top-meta b{font-family:var(--f-num);font-weight:500}
.sync{font-size:11.5px;opacity:.75;margin-top:4px}

/* ustawienia */
details.settings{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
details.settings summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary .hint{font-weight:400;color:var(--muted);font-size:13px;text-align:right}
.set-body{padding:0 14px 14px;display:grid;gap:12px}
.note{font-size:13px;color:var(--muted);margin:0}

label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
input.money{font-family:var(--f-num);text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 88px;gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.grid3 .vat{grid-column:1/-1}}

/* klienci */
.list{display:grid;gap:12px;margin-top:16px}
.client{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.c-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left}
.c-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.c-title{flex:1;min-width:0}
.c-name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-com{text-align:right;flex-shrink:0}
.c-com .v{font-family:var(--f-num);font-weight:700;color:var(--accent);font-size:16px}
.c-com .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chev{width:18px;height:18px;flex-shrink:0;color:var(--muted);transition:transform .15s}
.client.open .chev{transform:rotate(180deg)}
.c-body{padding:2px 14px 14px;display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.client:not(.open) .c-body{display:none}
.badge{display:inline-block;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px}

.sec-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.costs{display:grid;gap:8px}
.cost{display:grid;grid-template-columns:1fr 120px 40px;gap:8px;align-items:center}
.icon-btn{width:40px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--muted);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{color:var(--danger);border-color:var(--danger)}
.link-btn{justify-self:start;background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:9px;padding:9px 12px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* rozliczenie */
.calc{background:var(--accent-soft);border-radius:11px;padding:12px 13px;display:grid;gap:4px}
.calc .r{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.calc .r span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.calc .r.sum{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:700}
.calc .r.big{font-size:17px;color:var(--accent);font-weight:800}
.calc .warn{font-size:12.5px;color:var(--danger)}

.c-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.del{background:none;border:0;color:var(--danger);font:inherit;font-size:14px;cursor:pointer;padding:6px 0}
.del.confirm{background:var(--danger-soft);border-radius:8px;padding:6px 10px;font-weight:700}
.dup{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:6px 0}

.empty{text-align:center;padding:36px 16px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.fab{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.fab button{display:block;width:100%;max-width:608px;margin:0 auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fab button:focus-visible,.link-btn:focus-visible,.chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div>
        <h1>Twoja prowizja razem</h1>
        <div class="total" id="sumCom">0,00 zł</div>
      </div>
      <div class="top-meta">
        <div>Klientów: <b id="sumCount">0</b></div>
        <div>Faktury netto: <b id="sumNet">0,00</b></div>
        <div>Koszty: <b id="sumCost">0,00</b></div>
      </div>
    </div>
    <div class="sync" id="sync">Dane zapisują się w tej przeglądarce</div>
  </header>

  <details class="settings" id="settings">
    <summary><span>Ustawienia prowizji</span><span class="hint" id="setHint"></span></summary>
    <div class="set-body">
      <div class="grid2">
        <label class="f">Stawka prowizji (%)
          <input id="rate" class="money" inputmode="decimal" autocomplete="off">
        </label>
        <label class="f">Domyślny VAT (%)
          <select id="vatDefault"><option>23</option><option>8</option><option>5</option><option>0</option></select>
        </label>
      </div>
      <label class="f">Od czego liczyć prowizję
        <select id="base">
          <option value="net-cost">Netto faktury minus koszty</option>
          <option value="net">Netto faktury (bez odliczania kosztów)</option>
          <option value="gross-cost">Brutto faktury minus koszty</option>
          <option value="gross">Brutto faktury (bez odliczania kosztów)</option>
        </select>
      </label>
      <p class="note">Koszty wpisujesz w tej samej wartości co podstawę: przy liczeniu od netto wpisuj koszty netto, przy brutto koszty brutto.</p>
    </div>
  </details>

  <div class="list" id="list"></div>
</div>

<div class="fab"><button id="addBtn" type="button">+ Dodaj klienta</button></div>

<script>
const LS_KEY = "kalk-prowizji-v1";
const COST_PRESETS = ["Materiały","Robocizna","Transport","Podwykonawca","Sprzęt"];
const BASE_LABEL = {"net-cost":"od netto minus koszty","net":"od netto","gross-cost":"od brutto minus koszty","gross":"od brutto"};

let state = null;
let openId = null;
let pendingDelete = null;

const uid = () => Math.random().toString(36).slice(2, 10);
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const parseNum = s => { if (s == null) return 0; const v = parseFloat(String(s).replace(/\s| /g, "").replace(",", ".")); return isFinite(v) ? v : 0; };
const fmt = n => n.toLocaleString("pl-PL", {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtIn = n => n ? String(round2(n)).replace(".", ",") : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function sampleState(){
  return {
    rate: 20, base: "net-cost", vat: 23,
    clients: [{
      id: uid(), example: true, name: "Kowalski Sp. z o.o.", what: "Remont łazienki, ul. Lipowa 4",
      date: new Date().toISOString().slice(0,10), amount: 15000, amountType: "netto", vat: 23,
      costs: [{id: uid(), name: "Materiały", value: 4200}, {id: uid(), name: "Robocizna", value: 3800}]
    }]
  };
}
function newClient(){
  return {id: uid(), name: "", what: "", date: new Date().toISOString().slice(0,10), amount: 0, amountType: "netto", vat: state.vat, costs: [{id: uid(), name: "Materiały", value: 0}, {id: uid(), name: "Robocizna", value: 0}]};
}

function amounts(c){
  const v = (c.vat ?? 23) / 100;
  const net = c.amountType === "brutto" ? c.amount / (1 + v) : c.amount;
  const gross = c.amountType === "brutto" ? c.amount : c.amount * (1 + v);
  return {net: round2(net), gross: round2(gross)};
}
function calc(c){
  const {net, gross} = amounts(c);
  const costs = round2(c.costs.reduce((s, x) => s + (Number(x.value) || 0), 0));
  const useGross = state.base.startsWith("gross");
  const minusCost = state.base.endsWith("cost");
  const start = useGross ? gross : net;
  const base = minusCost ? start - costs : start;
  const com = round2(Math.max(0, base) * state.rate / 100);
  return {net, gross, costs, start, base: round2(base), com, useGross, minusCost};
}

/* ---------- zapis (w przeglądarce) ---------- */
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
function normalize(s){
  s = s || {};
  return {rate: s.rate ?? 20, base: s.base || "net-cost", vat: s.vat ?? 23, clients: Array.isArray(s.clients) ? s.clients : []};
}
function changed(){ save(); }

/* ---------- widok ---------- */
const chev = '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l5 5 5-5"/></svg>';

function render(){
  document.getElementById("rate").value = fmtIn(state.rate);
  document.getElementById("vatDefault").value = String(state.vat);
  document.getElementById("base").value = state.base;
  const list = document.getElementById("list");
  if (!state.clients.length) {
    list.innerHTML = '<div class="empty"><b>Brak klientów</b>Dodaj pierwszą fakturę przyciskiem na dole ekranu.</div>';
  } else {
    list.innerHTML = state.clients.map(clientHtml).join("");
  }
  updateTotals();
}

function clientHtml(c){
  const r = calc(c), open = c.id === openId;
  const shown = c.amountType === "brutto" ? {n: amounts(c).net, b: c.amount} : {n: c.amount, b: amounts(c).gross};
  return `<article class="client${open ? " open" : ""}" data-id="${c.id}">
    <button type="button" class="c-head" data-act="toggle" aria-expanded="${open}">
      <div class="c-title">
        <div class="c-name" data-out="name">${esc(c.name) || "Nowy klient"}${c.example ? '<span class="badge">przykład</span>' : ""}</div>
        <div class="c-sub" data-out="sub">${esc(subLine(c, r))}</div>
      </div>
      <div class="c-com"><div class="l">prowizja</div><div class="v" data-out="com">${fmt(r.com)} zł</div></div>
      ${chev}
    </button>
    <div class="c-body">
      ${c.example ? '<p class="note">To przykładowy wpis, żeby pokazać jak działa liczenie. Nadpisz go swoimi danymi albo usuń.</p>' : ""}
      <div class="grid2">
        <label class="f">Nazwa klienta<input data-f="name" value="${esc(c.name)}" placeholder="np. Nowak Budownictwo" autocomplete="off"></label>
        <label class="f">Data faktury<input data-f="date" type="date" value="${esc(c.date)}"></label>
      </div>
      <label class="f">Za co (opis faktury)<input data-f="what" value="${esc(c.what)}" placeholder="np. montaż okien, 6 szt." autocomplete="off"></label>
      <div class="grid3">
        <label class="f">Kwota netto (zł)<input class="money" data-f="net" inputmode="decimal" value="${fmtIn(shown.n)}" placeholder="0,00" autocomplete="off"></label>
        <label class="f">Kwota brutto (zł)<input class="money" data-f="gross" inputmode="decimal" value="${fmtIn(shown.b)}" placeholder="0,00" autocomplete="off"></label>
        <label class="f vat">VAT<select data-f="vat">${[23,8,5,0].map(v => `<option value="${v}"${v === c.vat ? " selected" : ""}>${v}%</option>`).join("")}</select></label>
      </div>

      <p class="sec-t">Koszty stałe</p>
      <div class="costs">
        ${c.costs.map(k => `<div class="cost" data-cost="${k.id}">
          <input data-cf="name" value="${esc(k.name)}" placeholder="Nazwa kosztu" aria-label="Nazwa kosztu" autocomplete="off">
          <input class="money" data-cf="value" inputmode="decimal" value="${fmtIn(k.value)}" placeholder="0,00" aria-label="Kwota kosztu" autocomplete="off">
          <button type="button" class="icon-btn" data-act="delcost" aria-label="Usuń koszt">×</button>
        </div>`).join("")}
      </div>
      <div class="chips">
        <button type="button" class="chip" data-act="addcost" data-name="">+ koszt</button>
        ${COST_PRESETS.map(p => `<button type="button" class="chip" data-act="addcost" data-name="${p}">${p}</button>`).join("")}
      </div>

      <div class="calc" data-out="calc">${calcHtml(r)}</div>

      <div class="c-actions">
        <button type="button" class="dup" data-act="dup">Kopiuj jako nowego</button>
        <button type="button" class="del${pendingDelete === c.id ? " confirm" : ""}" data-act="del">${pendingDelete === c.id ? "Na pewno usunąć? Kliknij jeszcze raz" : "Usuń klienta"}</button>
      </div>
    </div>
  </article>`;
}
function subLine(c, r){
  const parts = [];
  if (c.what) parts.push(c.what);
  parts.push(fmt(r.net) + " zł netto");
  return parts.join(" · ");
}
function calcHtml(r){
  const lab = r.useGross ? "Faktura brutto" : "Faktura netto";
  let h = `<div class="r"><span>${lab}</span><span>${fmt(r.start)} zł</span></div>`;
  if (r.minusCost) {
    h += `<div class="r"><span>Koszty razem</span><span>− ${fmt(r.costs)} zł</span></div>`;
    h += `<div class="r sum"><span>Podstawa prowizji</span><span>${fmt(r.base)} zł</span></div>`;
  } else {
    h += `<div class="r"><span>Koszty (nie odliczane)</span><span>${fmt(r.costs)} zł</span></div>`;
  }
  h += `<div class="r big"><span>Prowizja ${fmtIn(state.rate) || 0}%</span><span>${fmt(r.com)} zł</span></div>`;
  if (r.base < 0) h += `<div class="warn">Koszty są wyższe niż kwota faktury, więc prowizja wynosi 0.</div>`;
  return h;
}
function refreshClient(c, skipEl){
  const el = document.querySelector(`.client[data-id="${c.id}"]`);
  if (!el) return;
  const r = calc(c);
  el.querySelector('[data-out="com"]').textContent = fmt(r.com) + " zł";
  el.querySelector('[data-out="sub"]').textContent = subLine(c, r);
  const nameEl = el.querySelector('[data-out="name"]');
  nameEl.innerHTML = (esc(c.name) || "Nowy klient") + (c.example ? '<span class="badge">przykład</span>' : "");
  el.querySelector('[data-out="calc"]').innerHTML = calcHtml(r);
  const {net, gross} = amounts(c);
  const nIn = el.querySelector('[data-f="net"]'), gIn = el.querySelector('[data-f="gross"]');
  if (nIn !== skipEl && c.amountType === "brutto") nIn.value = fmtIn(net);
  if (gIn !== skipEl && c.amountType === "netto") gIn.value = fmtIn(gross);
  updateTotals();
}
function updateTotals(){
  let com = 0, net = 0, cost = 0;
  state.clients.forEach(c => { const r = calc(c); com += r.com; net += r.net; cost += r.costs; });
  document.getElementById("sumCom").textContent = fmt(round2(com)) + " zł";
  document.getElementById("sumNet").textContent = fmt(round2(net));
  document.getElementById("sumCost").textContent = fmt(round2(cost));
  document.getElementById("sumCount").textContent = state.clients.length;
  document.getElementById("setHint").textContent = (fmtIn(state.rate) || 0) + "% " + BASE_LABEL[state.base];
}

/* ---------- zdarzenia ---------- */
const findClient = el => { const a = el.closest(".client"); return a && state.clients.find(c => c.id === a.dataset.id); };

document.getElementById("list").addEventListener("input", e => {
  const t = e.target, c = findClient(t);
  if (!c) return;
  const f = t.dataset.f, cf = t.dataset.cf;
  if (f === "name" || f === "what" || f === "date") c[f] = t.value;
  else if (f === "net") { c.amount = parseNum(t.value); c.amountType = "netto"; }
  else if (f === "gross") { c.amount = parseNum(t.value); c.amountType = "brutto"; }
  else if (f === "vat") c.vat = Number(t.value);
  else if (cf) {
    const k = c.costs.find(x => x.id === t.closest(".cost").dataset.cost);
    if (!k) return;
    if (cf === "name") k.name = t.value; else k.value = parseNum(t.value);
  } else return;
  if (c.example) c.example = false;
  refreshClient(c, t);
  changed();
});
document.getElementById("list").addEventListener("change", e => {
  if (e.target.dataset.f === "vat") { const c = findClient(e.target); c.vat = Number(e.target.value); refreshClient(c); changed(); }
});
document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const c = findClient(b), act = b.dataset.act;
  if (act !== "del") pendingDelete = null;
  if (act === "toggle") { openId = openId === c.id ? null : c.id; render(); return; }
  if (act === "addcost") {
    const k = {id: uid(), name: b.dataset.name, value: 0};
    c.costs.push(k); render(); changed();
    const el = document.querySelector(`.cost[data-cost="${k.id}"] input[data-cf="${b.dataset.name ? "value" : "name"}"]`);
    el && el.focus();
    return;
  }
  if (act === "delcost") { c.costs = c.costs.filter(k => k.id !== b.closest(".cost").dataset.cost); render(); changed(); return; }
  if (act === "dup") {
    const n = JSON.parse(JSON.stringify(c)); n.id = uid(); n.example = false; n.name = c.name ? c.name + " (kopia)" : "";
    n.costs.forEach(k => k.id = uid());
    state.clients.splice(state.clients.indexOf(c) + 1, 0, n); openId = n.id; render(); changed(); return;
  }
  if (act === "del") {
    if (pendingDelete === c.id) { state.clients = state.clients.filter(x => x !== c); pendingDelete = null; render(); changed(); }
    else { pendingDelete = c.id; render(); }
  }
});
document.getElementById("addBtn").addEventListener("click", () => {
  const c = newClient();
  state.clients.unshift(c); openId = c.id; pendingDelete = null; render(); changed();
  window.scrollTo({top: 0, behavior: "smooth"});
  setTimeout(() => { const el = document.querySelector(`.client[data-id="${c.id}"] input[data-f="name"]`); el && el.focus({preventScroll:true}); }, 50);
});
document.getElementById("rate").addEventListener("input", e => { state.rate = parseNum(e.target.value); state.clients.forEach(c => refreshClient(c)); updateTotals(); changed(); });
document.getElementById("base").addEventListener("change", e => { state.base = e.target.value; state.clients.forEach(c => refreshClient(c)); updateTotals(); changed(); });
document.getElementById("vatDefault").addEventListener("change", e => { state.vat = Number(e.target.value); changed(); });

/* ---------- start ---------- */
(function init(){
  let s = null;
  try { const raw = localStorage.getItem(LS_KEY); if (raw) s = JSON.parse(raw); } catch(e){}
  state = s ? normalize(s) : sampleState();
  openId = state.clients[0]?.id || null;
  render();
})();
</script>
