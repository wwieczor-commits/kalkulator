<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kalkulator prowizji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: ekran główny = suma + lista klientów; wpisywanie na osobnym ekranie z krokami 1-2-3 i prowizją przyklejoną na dole */
:root{
  --bg:#f2f4f1; --card:#ffffff; --ink:#15231c; --muted:#5b6b62; --line:#d9e1db;
  --accent:#1f6b4f; --accent-ink:#ffffff; --accent-soft:#e2efe7; --danger:#b23a2b; --danger-soft:#f8e4e0;
  --field:#f7f9f7;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1612; --card:#17211c; --ink:#e8efea; --muted:#9aaba1; --line:#2a3731;
  --accent:#52bd8d; --accent-ink:#0a140f; --accent-soft:#1b3127; --danger:#f08a7a; --danger-soft:#3a201b;
  --field:#121b16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1612; --card:#17211c; --ink:#e8efea; --muted:#9aaba1; --line:#2a3731;
  --accent:#52bd8d; --accent-ink:#0a140f; --accent-soft:#1b3127; --danger:#f08a7a; --danger-soft:#3a201b;
  --field:#121b16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--accent)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:620px;margin:0 auto}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ===== ekran główny ===== */
.top{background:var(--accent);color:var(--accent-ink);padding-block:18px 20px}
.top .lbl{font-size:14px;font-weight:600;opacity:.9}
.top .total{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-.01em;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.13);border-radius:10px;padding:8px 10px;min-width:0}
.stat .k{font-size:12px;opacity:.85}
.stat .v{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rule{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;width:100%;color:var(--ink);text-align:left}
.rule b{font-weight:700}
.rule .ch{color:var(--accent);font-weight:700;font-size:14px;flex-shrink:0}
.setpanel{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;margin-top:-8px;padding:18px 14px 14px;display:grid;gap:14px}

.h2{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.h2 h2{margin:0;font-size:18px}
.h2 span{color:var(--muted);font-size:14px}
.list{display:grid;gap:10px;padding-bottom:110px}
.card{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px}
.card:hover{border-color:var(--accent)}
.card .row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .name{font-weight:700;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .date{color:var(--muted);font-size:13px;flex-shrink:0}
.card .what{color:var(--muted);font-size:14px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .nums{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px;margin-top:12px}
.card .nums div{min-width:0}
.card .nums .k{font-size:12px;color:var(--muted)}
.card .nums .v{font-weight:600;white-space:nowrap}
.card .nums .com{background:var(--accent-soft);border-radius:9px;padding:6px 9px;margin:-6px 0}
.card .nums .com .v{color:var(--accent);font-weight:800;font-size:17px}
.card .nums .com .k{color:var(--accent)}
.empty{text-align:center;padding:32px 18px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.fab{position:fixed;left:0;right:0;bottom:0;z-index:10;padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 65%,transparent)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}

/* ===== ekran edycji ===== */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .inner{display:flex;align-items:center;gap:8px;padding-block:10px}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 4px;font-size:16px}
.bar .t{flex:1;text-align:center;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sp{width:70px}
.form{display:grid;gap:16px;padding-block:16px 150px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;display:grid;gap:12px}
.step h3{margin:0;font-size:16px;display:flex;align-items:center;gap:9px}
.step h3 i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:800;flex-shrink:0}
label.f{display:grid;gap:5px;font-size:14px;font-weight:600;min-width:0}
input,select{font:inherit;font-size:17px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
input::placeholder{color:var(--muted);opacity:.7}
.money-wrap{position:relative}
.money-wrap input{text-align:right;padding-right:38px}
.money-wrap::after{content:"zł";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
.pct::after{content:"%"}
.big input{font-size:24px;font-weight:700;padding-block:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:10px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.vats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vats .k{font-size:14px;font-weight:600;margin-right:4px}
.pill{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.other{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:15px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.other b{font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.two{grid-template-columns:1fr}}

.cost{display:grid;grid-template-columns:1fr 130px 44px;gap:8px;align-items:center}
.x{width:44px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--muted);font-size:22px;line-height:1}
.x:hover{color:var(--danger);border-color:var(--danger)}
.addc{border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:10px;padding:11px;font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick .pill{font-weight:500}
.costsum{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--line);padding-top:10px}

.result{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px;display:grid;gap:6px}
.result .r{display:flex;justify-content:space-between;gap:10px;font-size:15px;opacity:.92}
.result .r.base{border-top:1px solid rgba(255,255,255,.3);padding-top:8px;opacity:1;font-weight:700}
.result .r.com{font-size:24px;font-weight:800;opacity:1;margin-top:2px}
.result .warn{font-size:13.5px;background:rgba(0,0,0,.18);border-radius:8px;padding:6px 9px}
.acts{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lnk{background:none;border:0;color:var(--muted);padding:8px 0;font-size:15px}
.lnk.danger{color:var(--danger)}
.lnk.danger.sure{background:var(--danger-soft);border-radius:8px;padding:8px 12px;font-weight:700}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.foot .inner{display:flex;align-items:center;gap:12px}
.foot .k{font-size:13px;color:var(--muted)}
.foot .v{font-size:22px;font-weight:800;color:var(--accent);white-space:nowrap}
.foot .btn{width:auto;padding:13px 26px;margin-left:auto}
.note{font-size:14px;color:var(--muted);margin:0}
.sync{font-size:12.5px;opacity:.8;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<!-- ekran główny -->
<header class="top gut">
  <div class="inner">
    <div class="lbl">Twoja prowizja łącznie</div>
    <div class="total" id="sumCom">0,00 zł</div>
    <div class="stats">
      <div class="stat"><div class="k">Klienci</div><div class="v" id="sumCount">0</div></div>
      <div class="stat"><div class="k">Faktury netto</div><div class="v" id="sumNet">0 zł</div></div>
      <div class="stat"><div class="k">Koszty</div><div class="v" id="sumCost">0 zł</div></div>
    </div>
    <div class="sync" id="sync">Dane zapisują się w tej przeglądarce</div>
  </div>
</header>

<main class="gut">
  <div class="inner">
    <button type="button" class="rule" id="ruleBtn" aria-expanded="false">
      <span>Liczę <b id="ruleTxt">20% od netto minus koszty</b></span><span class="ch" id="ruleCh">Zmień</span>
    </button>
    <div class="setpanel" id="setPanel" hidden>
      <div class="two">
        <label class="f">Stawka prowizji
          <div class="money-wrap pct"><input id="rate" inputmode="decimal" autocomplete="off"></div>
        </label>
        <label class="f">VAT dla nowych faktur
          <select id="vatDefault"><option value="23">23%</option><option value="8">8%</option><option value="5">5%</option><option value="0">0%</option></select>
        </label>
      </div>
      <label class="f">Prowizja liczona od
        <select id="base">
          <option value="net-cost">kwoty netto minus koszty</option>
          <option value="net">całej kwoty netto</option>
          <option value="gross-cost">kwoty brutto minus koszty</option>
          <option value="gross">całej kwoty brutto</option>
        </select>
      </label>
      <p class="note">Koszty wpisuj tak samo jak podstawę: przy liczeniu od netto koszty netto, przy brutto koszty brutto.</p>
    </div>

    <div class="h2"><h2>Klienci</h2><span>dotknij, żeby edytować</span></div>
    <div class="list" id="list"></div>
  </div>
</main>

<div class="fab gut"><div class="inner"><button type="button" class="btn" id="addBtn">+ Dodaj klienta</button></div></div>

<!-- ekran edycji -->
<section class="sheet" id="sheet" hidden aria-label="Edycja klienta">
  <div class="bar gut"><div class="inner">
    <button type="button" class="back" data-act="close">‹ Lista</button>
    <div class="t" id="sheetTitle">Nowy klient</div>
    <div class="sp"></div>
  </div></div>
  <div class="gut"><div class="inner form" id="form"></div></div>
  <div class="foot gut"><div class="inner">
    <div><div class="k">Twoja prowizja</div><div class="v" id="footCom">0,00 zł</div></div>
    <button type="button" class="btn" data-act="close">Gotowe</button>
  </div></div>
</section>

<script>
const LS_KEY = "kalk-prowizji-v1";
const COST_PRESETS = ["Materiały","Robocizna","Transport","Podwykonawca","Sprzęt"];
const BASE_TXT = {"net-cost":"od netto minus koszty","net":"od całego netto","gross-cost":"od brutto minus koszty","gross":"od całego brutto"};

let state = null;
let editId = null;
let sureDelete = false;

const uid = () => Math.random().toString(36).slice(2, 10);
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const parseNum = s => { const v = parseFloat(String(s ?? "").replace(/[\s ]/g, "").replace(",", ".")); return isFinite(v) ? v : 0; };
const fmt = n => n.toLocaleString("pl-PL", {minimumFractionDigits:2, maximumFractionDigits:2});
const fmt0 = n => n.toLocaleString("pl-PL", {maximumFractionDigits:0});
const fmtIn = n => n ? String(round2(n)).replace(".", ",") : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { if (!d) return ""; const [y,m,dd] = d.split("-"); return `${dd}.${m}.${y}`; };

function newClient(){
  return {id: uid(), name: "", what: "", date: today(), amount: 0, amountType: "netto", vat: state.vat, costs: [{id: uid(), name: "Materiały", value: 0}, {id: uid(), name: "Robocizna", value: 0}]};
}
const isBlank = c => !c.name.trim() && !c.what.trim() && !c.amount && c.costs.every(k => !k.value);

function amounts(c){
  const v = (c.vat ?? 23) / 100;
  return c.amountType === "brutto"
    ? {net: round2(c.amount / (1 + v)), gross: round2(c.amount)}
    : {net: round2(c.amount), gross: round2(c.amount * (1 + v))};
}
function calc(c){
  const {net, gross} = amounts(c);
  const costs = round2(c.costs.reduce((s, x) => s + (Number(x.value) || 0), 0));
  const useGross = state.base.startsWith("gross"), minusCost = state.base.endsWith("cost");
  const start = useGross ? gross : net;
  const base = round2(minusCost ? start - costs : start);
  return {net, gross, costs, start, base, com: round2(Math.max(0, base) * state.rate / 100), useGross, minusCost};
}

/* ---------- zapis ---------- */
let docRef = null, saveTimer = null, saving = Promise.resolve();
const setSync = t => document.getElementById("sync").textContent = t;
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
function save(){
  saveLocal();
  if (!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const snap = JSON.parse(JSON.stringify({...state, savedAt: Date.now()}));
    saving = saving.then(() => docRef.set(snap)).then(
      () => setSync("Zapisano na koncie, widać na każdym urządzeniu"),
      () => setSync("Nie udało się zapisać na koncie, dane są w tej przeglądarce"));
  }, 700);
}
function changed(){ state._touched = true; state._savedAt = Date.now(); save(); }
function normalize(s){
  s = s || {};
  const clients = (Array.isArray(s.clients) ? s.clients : []).filter(c => !c.example);
  return {rate: s.rate ?? 20, base: s.base || "net-cost", vat: s.vat ?? 23, clients, _touched: s._touched, _savedAt: s._savedAt || s.savedAt};
}
async function connectDb(){
  try {
    if (!window.claude?.use) return;
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    docRef = d.doc("data/users/" + id + "/main");
    const snap = await docRef.get();
    if (snap.exists) {
      const remote = snap.data();
      if (!state._touched || (remote.savedAt || 0) >= (state._savedAt || 0)) {
        const keepEditing = editId && !state.clients.some(c => c.id === editId && !isBlank(c)) ? state.clients.find(c => c.id === editId) : null;
        state = normalize(JSON.parse(JSON.stringify(remote)));
        if (keepEditing) state.clients.unshift(keepEditing);
        saveLocal(); renderMain(); if (editId && !keepEditing) renderForm();
      } else save();
    } else if (state._touched) save();
    setSync("Zapisano na koncie, widać na każdym urządzeniu");
  } catch(e){}
}

/* ---------- ekran główny ---------- */
function renderMain(){
  document.getElementById("rate").value = fmtIn(state.rate);
  document.getElementById("vatDefault").value = String(state.vat);
  document.getElementById("base").value = state.base;
  document.getElementById("ruleTxt").textContent = (fmtIn(state.rate) || "0") + "% " + BASE_TXT[state.base];
  const shown = state.clients.filter(c => !isBlank(c));
  const list = document.getElementById("list");
  list.innerHTML = shown.length ? shown.map(c => {
    const r = calc(c);
    return `<button type="button" class="card" data-open="${c.id}">
      <div class="row1"><span class="name">${esc(c.name) || "Bez nazwy"}</span><span class="date">${fmtDate(c.date)}</span></div>
      ${c.what ? `<div class="what">${esc(c.what)}</div>` : ""}
      <div class="nums">
        <div><div class="k">Netto</div><div class="v">${fmt(r.net)}</div></div>
        <div><div class="k">Koszty</div><div class="v">${fmt(r.costs)}</div></div>
        <div class="com"><div class="k">Prowizja</div><div class="v">${fmt(r.com)} zł</div></div>
      </div>
    </button>`;
  }).join("") : `<div class="empty"><b>Nie masz jeszcze klientów</b>Naciśnij „+ Dodaj klienta” na dole.</div>`;
  let com = 0, net = 0, cost = 0;
  shown.forEach(c => { const r = calc(c); com += r.com; net += r.net; cost += r.costs; });
  document.getElementById("sumCom").textContent = fmt(round2(com)) + " zł";
  document.getElementById("sumNet").textContent = fmt0(net) + " zł";
  document.getElementById("sumCost").textContent = fmt0(cost) + " zł";
  document.getElementById("sumCount").textContent = shown.length;
}

/* ---------- ekran edycji ---------- */
const cur = () => state.clients.find(c => c.id === editId);

function openEditor(id, focusName){
  editId = id; sureDelete = false;
  document.getElementById("sheet").hidden = false;
  document.body.classList.add("locked");
  renderForm();
  document.getElementById("sheet").scrollTop = 0;
  if (focusName) setTimeout(() => document.querySelector('#form [data-f="name"]')?.focus(), 60);
}
function closeEditor(){
  const c = cur();
  if (c && isBlank(c)) state.clients = state.clients.filter(x => x !== c);
  editId = null;
  document.getElementById("sheet").hidden = true;
  document.body.classList.remove("locked");
  renderMain(); save();
}

function renderForm(){
  const c = cur(); if (!c) return;
  const isB = c.amountType === "brutto";
  document.getElementById("form").innerHTML = `
    <div class="step">
      <h3><i>1</i>Klient</h3>
      <label class="f">Nazwa klienta<input data-f="name" value="${esc(c.name)}" placeholder="np. Nowak Budownictwo" autocomplete="off" enterkeyhint="next"></label>
      <label class="f">Za co jest faktura<input data-f="what" value="${esc(c.what)}" placeholder="np. montaż okien, 6 szt." autocomplete="off" enterkeyhint="next"></label>
      <label class="f">Data faktury<input data-f="date" type="date" value="${esc(c.date)}"></label>
    </div>

    <div class="step">
      <h3><i>2</i>Kwota z faktury</h3>
      <div class="seg" role="group" aria-label="Rodzaj kwoty">
        <button type="button" data-act="type" data-v="netto" aria-pressed="${!isB}">Netto</button>
        <button type="button" data-act="type" data-v="brutto" aria-pressed="${isB}">Brutto</button>
      </div>
      <label class="f">Kwota ${isB ? "brutto" : "netto"}
        <div class="money-wrap big"><input data-f="amount" inputmode="decimal" value="${fmtIn(c.amount)}" placeholder="0,00" autocomplete="off"></div>
      </label>
      <div class="vats"><span class="k">VAT</span>${[23,8,5,0].map(v => `<button type="button" class="pill" data-act="vat" data-v="${v}" aria-pressed="${v === c.vat}">${v}%</button>`).join("")}</div>
      <div class="other" data-out="other"></div>
    </div>

    <div class="step">
      <h3><i>3</i>Koszty</h3>
      <div style="display:grid;gap:8px">
        ${c.costs.map(k => `<div class="cost" data-cost="${k.id}">
          <input data-cf="name" value="${esc(k.name)}" placeholder="Nazwa" aria-label="Nazwa kosztu" autocomplete="off">
          <div class="money-wrap"><input data-cf="value" inputmode="decimal" value="${fmtIn(k.value)}" placeholder="0,00" aria-label="Kwota kosztu ${esc(k.name)}" autocomplete="off"></div>
          <button type="button" class="x" data-act="delcost" aria-label="Usuń koszt">×</button>
        </div>`).join("") || `<p class="note">Brak kosztów.</p>`}
      </div>
      <button type="button" class="addc" data-act="addcost" data-name="">+ Dodaj koszt</button>
      <div class="quick">${COST_PRESETS.filter(p => !c.costs.some(k => k.name === p)).map(p => `<button type="button" class="pill" data-act="addcost" data-name="${p}">+ ${p}</button>`).join("")}</div>
      <div class="costsum"><span>Koszty razem</span><span data-out="costsum"></span></div>
    </div>

    <div class="result" data-out="result"></div>

    <div class="acts">
      <button type="button" class="lnk" data-act="dup">Skopiuj jako nowego klienta</button>
      <button type="button" class="lnk danger${sureDelete ? " sure" : ""}" data-act="del">${sureDelete ? "Na pewno? Dotknij jeszcze raz" : "Usuń klienta"}</button>
    </div>`;
  refreshForm();
}
function refreshForm(){
  const c = cur(); if (!c) return;
  const r = calc(c);
  document.getElementById("sheetTitle").textContent = c.name.trim() || "Nowy klient";
  const vatAmt = round2(r.gross - r.net);
  document.querySelector('[data-out="other"]').innerHTML = c.amountType === "brutto"
    ? `<span>Netto: <b>${fmt(r.net)} zł</b></span><span>VAT: ${fmt(vatAmt)} zł</span>`
    : `<span>Brutto: <b>${fmt(r.gross)} zł</b></span><span>VAT: ${fmt(vatAmt)} zł</span>`;
  document.querySelector('[data-out="costsum"]').textContent = fmt(r.costs) + " zł";
  const rate = fmtIn(state.rate) || "0";
  let h = `<div class="r"><span>Faktura ${r.useGross ? "brutto" : "netto"}</span><span>${fmt(r.start)} zł</span></div>`;
  if (r.minusCost) {
    h += `<div class="r"><span>minus koszty</span><span>− ${fmt(r.costs)} zł</span></div>`;
    h += `<div class="r base"><span>Zostaje</span><span>${fmt(r.base)} zł</span></div>`;
  }
  h += `<div class="r com"><span>Prowizja ${rate}%</span><span>${fmt(r.com)} zł</span></div>`;
  if (r.base < 0) h += `<div class="warn">Koszty są wyższe niż faktura, więc prowizja wynosi 0 zł.</div>`;
  document.querySelector('[data-out="result"]').innerHTML = h;
  document.getElementById("footCom").textContent = fmt(r.com) + " zł";
}

/* ---------- zdarzenia ---------- */
document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest("[data-open]"); if (b) openEditor(b.dataset.open);
});
document.getElementById("addBtn").addEventListener("click", () => {
  const c = newClient(); state.clients.unshift(c); openEditor(c.id, true);
});
document.getElementById("ruleBtn").addEventListener("click", e => {
  const p = document.getElementById("setPanel"); p.hidden = !p.hidden;
  e.currentTarget.setAttribute("aria-expanded", String(!p.hidden));
  document.getElementById("ruleCh").textContent = p.hidden ? "Zmień" : "Zwiń";
});
document.getElementById("rate").addEventListener("input", e => { state.rate = parseNum(e.target.value); const v = e.target.value; renderMain(); e.target.value = v; changed(); });
document.getElementById("base").addEventListener("change", e => { state.base = e.target.value; renderMain(); changed(); });
document.getElementById("vatDefault").addEventListener("change", e => { state.vat = Number(e.target.value); changed(); });

const sheet = document.getElementById("sheet");
sheet.addEventListener("input", e => {
  const t = e.target, c = cur(); if (!c) return;
  const f = t.dataset.f, cf = t.dataset.cf;
  if (f === "name" || f === "what" || f === "date") c[f] = t.value;
  else if (f === "amount") c.amount = parseNum(t.value);
  else if (cf) {
    const k = c.costs.find(x => x.id === t.closest(".cost").dataset.cost); if (!k) return;
    if (cf === "name") k.name = t.value; else k.value = parseNum(t.value);
  } else return;
  refreshForm(); changed();
});
sheet.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  const all = [...sheet.querySelectorAll("#form input")];
  const i = all.indexOf(e.target);
  if (i > -1 && all[i + 1]) { e.preventDefault(); all[i + 1].focus(); }
});
sheet.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, c = cur();
  if (act !== "del") sureDelete = false;
  if (act === "close") return closeEditor();
  if (!c) return;
  if (act === "type") {
    const a = amounts(c);
    c.amountType = b.dataset.v; c.amount = b.dataset.v === "brutto" ? a.gross : a.net;
    renderForm(); changed(); return;
  }
  if (act === "vat") {
    c.vat = Number(b.dataset.v); renderForm(); changed(); return;
  }
  if (act === "addcost") {
    const k = {id: uid(), name: b.dataset.name, value: 0};
    c.costs.push(k); renderForm(); changed();
    sheet.querySelector(`.cost[data-cost="${k.id}"] input[data-cf="${k.name ? "value" : "name"}"]`)?.focus();
    return;
  }
  if (act === "delcost") { c.costs = c.costs.filter(k => k.id !== b.closest(".cost").dataset.cost); renderForm(); changed(); return; }
  if (act === "dup") {
    const n = JSON.parse(JSON.stringify(c)); n.id = uid(); n.name = c.name ? c.name + " (kopia)" : ""; n.date = today();
    n.costs.forEach(k => k.id = uid());
    state.clients.unshift(n); changed(); openEditor(n.id, true); return;
  }
  if (act === "del") {
    if (sureDelete) { state.clients = state.clients.filter(x => x !== c); editId = null; sureDelete = false; changed(); closeEditor(); }
    else { sureDelete = true; renderForm(); }
  }
});

/* ---------- start: od razu pusty formularz, jeśli nie ma klientów ---------- */
(function init(){
  let s = null;
  try { const raw = localStorage.getItem(LS_KEY); if (raw) s = JSON.parse(raw); } catch(e){}
  state = normalize(s);
  state.clients = state.clients.filter(c => !isBlank(c));
  renderMain();
  if (!state.clients.length) { const c = newClient(); state.clients.unshift(c); openEditor(c.id, true); }
  connectDb();
})();
</script>
