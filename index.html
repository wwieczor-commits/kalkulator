<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c4e94">
<meta name="author" content="Wojciech Wieczorek">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kalkulator prowizji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: ekran główny = suma + lista klientów; wpisywanie na osobnym ekranie z krokami 1-2-3 i prowizją przyklejoną na dole */
:root{
  --bg:#f1f4f9; --card:#ffffff; --ink:#141c2b; --muted:#5a6578; --line:#d7dfea;
  --accent:#1c4e94; --accent-ink:#ffffff; --accent-soft:#e2ebf8; --danger:#b23a2b; --danger-soft:#f8e4e0;
  --field:#f6f8fc;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d121b; --card:#151d2a; --ink:#e6ecf5; --muted:#99a5b8; --line:#283346;
  --accent:#6ea6ff; --accent-ink:#07101f; --accent-soft:#172a47; --danger:#f08a7a; --danger-soft:#3a201b;
  --field:#101724; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d121b; --card:#151d2a; --ink:#e6ecf5; --muted:#99a5b8; --line:#283346;
  --accent:#6ea6ff; --accent-ink:#07101f; --accent-soft:#172a47; --danger:#f08a7a; --danger-soft:#3a201b;
  --field:#101724; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:620px;margin:0 auto}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ===== ekran główny ===== */
.cfg-wrap{padding-block:14px}
.cfg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.cfg-row{display:grid;grid-template-columns:150px 170px 1fr;gap:10px;align-items:end}
@media (max-width:520px){.cfg-row{grid-template-columns:1fr 1fr}.cfg-row .base{grid-column:1/-1}}
.top{background:var(--accent);color:var(--accent-ink);padding-block:18px 20px}
.top .lbl{font-size:14px;font-weight:600;opacity:.9}
.top .total{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-.01em;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.13);border-radius:10px;padding:8px 10px;min-width:0}
.stat .k{font-size:12px;opacity:.85}
.stat .v{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.person{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rule{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;width:100%;color:var(--ink);text-align:left}
.rule b{font-weight:700}
.rule .ch{color:var(--accent);font-weight:700;font-size:14px;flex-shrink:0}
.setpanel{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;margin-top:-8px;padding:18px 14px 14px;display:grid;gap:14px}

.h2{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.h2 h2{margin:0;font-size:18px}
.h2 span{color:var(--muted);font-size:14px}
.list{display:grid;gap:10px}
.copy{margin:22px 0 0;padding-bottom:110px;text-align:center;font-size:12px;color:var(--muted)}
.card{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-main{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:14px}
.card-foot{border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.card-foot button{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;padding:11px 14px}
.cb{margin-top:16px;border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px}
.cb-t{font-size:12px;color:var(--muted);font-weight:600}
.cb-r{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.cb-r span:first-child{min-width:0}
.cb-r small{display:block;color:var(--muted);font-size:12.5px}
.cb-r span:last-child{white-space:nowrap;font-weight:600}
.pdfall{margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.card:hover{border-color:var(--accent)}
.card .row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .name{font-weight:700;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .date{color:var(--muted);font-size:13px;flex-shrink:0}
.card .what{color:var(--muted);font-size:14px;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.card .nums{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px;margin-top:12px}
.card .nums div{min-width:0}
.card .nums .k{font-size:12px;color:var(--muted)}
.card .nums .v{font-weight:600;white-space:nowrap}
.card .nums .com{background:var(--accent-soft);border-radius:9px;padding:6px 9px;margin:-6px 0}
.card .nums .com .v{color:var(--accent);font-weight:800;font-size:17px}
.card .nums .com .k{color:var(--accent)}
.clear{background:none;border:1px solid var(--line);color:var(--danger);border-radius:12px;padding:13px;font-weight:600;margin-top:14px}
.clear.sure{background:var(--danger-soft);border-color:var(--danger);font-weight:700}
.empty{text-align:center;padding:32px 18px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.fab{position:fixed;left:0;right:0;bottom:0;z-index:10;padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 65%,transparent)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}

/* ===== ekran edycji ===== */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .inner{display:flex;align-items:center;gap:8px;padding-block:10px}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 4px;font-size:16px}
.bar .t{flex:1;text-align:center;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sp{width:70px}
.form{display:grid;gap:16px;padding-block:16px 150px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;display:grid;gap:12px}
.step h3{margin:0;font-size:16px;display:flex;align-items:center;gap:9px}
.step h3 i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:800;flex-shrink:0}
label.f{display:grid;gap:5px;font-size:14px;font-weight:600;min-width:0}
input,select,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:52px;line-height:1.4}
.opt{font-weight:400;color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
input::placeholder{color:var(--muted);opacity:.7}
.money-wrap{position:relative}
.money-wrap input{text-align:right;padding-right:38px}
.money-wrap::after{content:"zł";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
.pct::after{content:"%"}
.big input{font-size:24px;font-weight:700;padding-block:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:10px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.vats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vats .k{font-size:14px;font-weight:600;margin-right:4px}
.pill{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.other{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:15px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.other b{font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.two{grid-template-columns:1fr}}

.cost{display:grid;grid-template-columns:1fr 130px 44px;gap:8px;align-items:center}
@media (max-width:480px){.cost{grid-template-columns:1fr 44px;gap:6px 8px;padding-bottom:10px;border-bottom:1px solid var(--line)}.cost [data-cf="name"]{grid-column:1/-1;font-weight:600}}
.x{width:44px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--muted);font-size:22px;line-height:1}
.x:hover{color:var(--danger);border-color:var(--danger)}
.addc{border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:10px;padding:11px;font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick .pill{font-weight:500}
.cost.hours{grid-template-columns:1fr 44px;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.cost.hours [data-cf="name"]{grid-column:1;font-weight:600}
.hrs{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.4fr);gap:8px;align-items:end}
.mini{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.mini input[data-cf="hours"]{text-align:right}
.times{padding-bottom:13px;color:var(--muted);font-weight:700;font-size:18px}
.hsum{grid-column:1/-1;display:flex;justify-content:space-between;font-weight:700;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.costsum{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--line);padding-top:10px}

.result{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px;display:grid;gap:6px}
.result .r{display:flex;justify-content:space-between;gap:10px;font-size:15px;opacity:.92}
.result .r.base{border-top:1px solid rgba(255,255,255,.3);padding-top:8px;opacity:1;font-weight:700}
.result .r.com{font-size:24px;font-weight:800;opacity:1;margin-top:2px}
.result .warn{font-size:13.5px;background:rgba(0,0,0,.18);border-radius:8px;padding:6px 9px}
.acts{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lnk{background:none;border:0;color:var(--muted);padding:8px 0;font-size:15px}
.lnk.danger{color:var(--danger)}
.lnk.danger.sure{background:var(--danger-soft);border-radius:8px;padding:8px 12px;font-weight:700}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.foot .inner{display:flex;align-items:center;gap:12px}
.foot .k{font-size:13px;color:var(--muted)}
.foot .v{font-size:22px;font-weight:800;color:var(--accent);white-space:nowrap}
.foot .btn{width:auto;padding:13px 26px;margin-left:auto}
.note{font-size:14px;color:var(--muted);margin:0}
.sync{font-size:12.5px;opacity:.8;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<!-- ekran główny -->
<section class="gut cfg-wrap" aria-label="Ustawienia prowizji">
  <div class="inner cfg">
    <label class="f">Kogo dotyczy prowizja
      <input id="person" placeholder="imię i nazwisko, np. Jan Kowalski" autocomplete="name" enterkeyhint="done">
    </label>
    <div class="cfg-row">
      <label class="f">Stawka prowizji
        <div class="money-wrap pct"><input id="rate" inputmode="decimal" autocomplete="off"></div>
      </label>
      <label class="f">VAT nowych faktur
        <select id="vatDefault"><option value="23">23%</option><option value="8">8%</option><option value="5">5%</option><option value="0">0%</option></select>
      </label>
      <label class="f base">Prowizja liczona od
        <select id="base">
          <option value="net-cost">netto minus koszty</option>
          <option value="net">całego netto</option>
          <option value="gross-cost">brutto minus koszty</option>
          <option value="gross">całego brutto</option>
        </select>
      </label>
    </div>
  </div>
</section>

<header class="top gut">
  <div class="inner">
    <div class="lbl" id="topLbl">Twoja prowizja łącznie</div>
    <div class="total" id="sumCom">0,00 zł</div>
    <div class="stats">
      <div class="stat"><div class="k">Klienci</div><div class="v" id="sumCount">0</div></div>
      <div class="stat"><div class="k">Faktury netto</div><div class="v" id="sumNet">0 zł</div></div>
      <div class="stat"><div class="k">Koszty</div><div class="v" id="sumCost">0 zł</div></div>
    </div>
    <div class="sync" id="sync">Dane zapisują się w tej przeglądarce</div>
  </div>
</header>

<main class="gut">
  <div class="inner">
    <div class="h2"><h2>Klienci</h2><span>dotknij, żeby edytować</span></div>
    <div class="list" id="list"></div>
    <p class="copy">© 2026 Wojciech Wieczorek</p>
  </div>
</main>

<div class="toast" id="toast" role="status" hidden></div>
<div class="fab gut"><div class="inner"><button type="button" class="btn" id="addBtn">+ Dodaj klienta</button></div></div>

<!-- ekran edycji -->
<section class="sheet" id="sheet" hidden aria-label="Edycja klienta">
  <div class="bar gut"><div class="inner">
    <button type="button" class="back" data-act="close">‹ Lista</button>
    <div class="t" id="sheetTitle">Nowy klient</div>
    <div class="sp"></div>
  </div></div>
  <div class="gut"><div class="inner form" id="form"></div></div>
  <div class="foot gut"><div class="inner">
    <div><div class="k">Twoja prowizja</div><div class="v" id="footCom">0,00 zł</div></div>
    <button type="button" class="btn" data-act="close">Gotowe</button>
  </div></div>
</section>

<script>
const LS_KEY = "kalk-prowizji-v1";
const COST_PRESETS = ["Godziny pracowników","Materiały","Transport","Podwykonawca","Sprzęt"];
const BASE_TXT = {"net-cost":"od netto minus koszty","net":"od całego netto","gross-cost":"od brutto minus koszty","gross":"od całego brutto"};

let state = null;
let editId = null;
let sureDelete = false;
let sureClear = false, sureClearTimer = null;

const uid = () => Math.random().toString(36).slice(2, 10);
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const parseNum = s => { const v = parseFloat(String(s ?? "").replace(/[\s ]/g, "").replace(",", ".")); return isFinite(v) ? v : 0; };
const group = d => d.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const fmt = n => { const [i, d] = Math.abs(round2(n)).toFixed(2).split("."); return (n < 0 ? "−" : "") + group(i) + "," + d; };
const fmt0 = n => (n < 0 ? "−" : "") + group(String(Math.round(Math.abs(n))));
const fmtIn = n => n ? fmt(n) : "";
const fmtRate = n => n ? String(round2(n)).replace(".", ",") : "";

/* formatowanie kwoty w trakcie pisania: 3000000,5 -> 3 000 000,5, kursor zostaje na swoim miejscu */
function liveMoney(el){
  const v = el.value, pos = el.selectionStart ?? v.length;
  const sig = ch => /[\d.,]/.test(ch);
  const before = [...v.slice(0, pos)].filter(sig).length;
  let t = v.replace(/\./g, ",").replace(/[^\d,]/g, "");
  const k = t.indexOf(",");
  let int = k < 0 ? t : t.slice(0, k), dec = k < 0 ? null : t.slice(k + 1).replace(/,/g, "").slice(0, 2);
  int = int.replace(/^0+(?=\d)/, "");
  if (dec !== null && int === "") int = "0";
  const out = group(int) + (dec !== null ? "," + dec : "");
  if (out === v) return;
  el.value = out;
  let n = 0, c = 0;
  while (c < out.length && n < before) { if (sig(out[c])) n++; c++; }
  try { el.setSelectionRange(c, c); } catch(e){}
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { if (!d) return ""; const [y,m,dd] = d.split("-"); return `${dd}.${m}.${y}`; };

const HOURS_NAME = "Godziny pracowników";
function newCost(name){
  return name === HOURS_NAME ? {id: uid(), name, kind: "hours", hours: 0, rate: 0, value: 0} : {id: uid(), name, value: 0};
}
function newClient(){
  return {id: uid(), name: "", what: "", date: today(), amount: 0, amountType: "netto", vat: state.vat, costs: [newCost("Godziny pracowników"), newCost("Materiały")]};
}
const isBlank = c => !c.name.trim() && !c.what.trim() && !c.amount && c.costs.every(k => !k.value);

function amounts(c){
  const v = (c.vat ?? 23) / 100;
  return c.amountType === "brutto"
    ? {net: round2(c.amount / (1 + v)), gross: round2(c.amount)}
    : {net: round2(c.amount), gross: round2(c.amount * (1 + v))};
}
function calc(c){
  const {net, gross} = amounts(c);
  const costs = round2(c.costs.reduce((s, x) => s + (Number(x.value) || 0), 0));
  const useGross = state.base.startsWith("gross"), minusCost = state.base.endsWith("cost");
  const start = useGross ? gross : net;
  const base = round2(minusCost ? start - costs : start);
  return {net, gross, costs, start, base, com: round2(Math.max(0, base) * state.rate / 100), useGross, minusCost};
}

/* ---------- zapis ---------- */
let docRef = null, saveTimer = null, saving = Promise.resolve();
const setSync = t => document.getElementById("sync").textContent = t;
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
function save(){
  saveLocal();
  if (!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const snap = JSON.parse(JSON.stringify({...state, savedAt: Date.now()}));
    saving = saving.then(() => docRef.set(snap)).then(
      () => setSync("Zapisano na koncie, widać na każdym urządzeniu"),
      () => setSync("Nie udało się zapisać na koncie, dane są w tej przeglądarce"));
  }, 700);
}
function changed(){ state._touched = true; state._savedAt = Date.now(); save(); }
function normalize(s){
  s = s || {};
  const clients = (Array.isArray(s.clients) ? s.clients : []).filter(c => !c.example);
  return {person: s.person || "", rate: s.rate ?? 20, base: s.base || "net-cost", vat: s.vat ?? 23, clients, _touched: s._touched, _savedAt: s._savedAt || s.savedAt};
}
async function connectDb(){
  try {
    if (!window.claude?.use) return;
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    docRef = d.doc("data/users/" + id + "/main");
    const snap = await docRef.get();
    if (snap.exists) {
      const remote = snap.data();
      if (!state._touched || (remote.savedAt || 0) >= (state._savedAt || 0)) {
        const keepEditing = editId && !state.clients.some(c => c.id === editId && !isBlank(c)) ? state.clients.find(c => c.id === editId) : null;
        state = normalize(JSON.parse(JSON.stringify(remote)));
        if (keepEditing) state.clients.unshift(keepEditing);
        saveLocal(); renderMain(); if (editId && !keepEditing) renderForm();
      } else save();
    } else if (state._touched) save();
    setSync("Zapisano na koncie, widać na każdym urządzeniu");
  } catch(e){}
}

}

/* ---------- PDF ---------- */
const costDetail = k => k.kind === "hours" ? `${fmtRate(k.hours) || "0"} rbg × ${fmt(k.rate || 0)} zł/h` : "";
let toastTimer = null;
function toast(t, ms = 3500){
  const el = document.getElementById("toast"); el.textContent = t; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, ms);
}
let jspdfLoading = null;
function loadJsPdf(){
  if (window.jspdf) return Promise.resolve();
  return jspdfLoading ||= new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    sc.onload = res; sc.onerror = () => { jspdfLoading = null; rej(new Error("load")); };
    document.head.appendChild(sc);
  });
}
async function runPdf(fn){
  toast("Przygotowuję PDF…", 15000);
  try { await loadJsPdf(); await fn(); }
  catch(e){ toast("Nie udało się przygotować PDF. Sprawdź internet i spróbuj ponownie."); }
}
const PL = 18, PR = 192, PBOT = 280;
const INK = [22,30,42], MUTED = [96,106,122], ACC = [28,78,148], LINE = [205,213,225];
function newDoc(){
  const doc = new jspdf.jsPDF({unit: "mm", format: "a4"});
  doc.addFileToVFS("k-r.ttf", PDF_FONT_R); doc.addFont("k-r.ttf", "K", "normal");
  doc.addFileToVFS("k-b.ttf", PDF_FONT_B); doc.addFont("k-b.ttf", "K", "bold");
  doc.setFont("K", "normal");
  return {doc, y: 20};
}
function ensure(w, h){ if (w.y + h > PBOT) { w.doc.addPage(); w.y = 20; } }
function txt(w, s, x, o = {}){
  const d = w.doc;
  d.setFont("K", o.bold ? "bold" : "normal"); d.setFontSize(o.size || 11); d.setTextColor(...(o.color || INK));
  d.text(s, x, w.y, o.align ? {align: o.align} : undefined);
  return d.getTextWidth(s);
}
/* subtelna kropkowana linia prowadząca wzrok od opisu do kwoty */
function leader(w, x1, x2){
  if (x2 - x1 < 8) return;
  const d = w.doc;
  d.setLineDashPattern([0.3, 1.2], 0); d.setDrawColor(170, 182, 200); d.setLineWidth(0.25);
  d.line(x1 + 2.5, w.y - 0.7, x2 - 2.5, w.y - 0.7);
  d.setLineDashPattern([], 0);
}
function row(w, left, right, o = {}){
  const size = o.size || 11;
  ensure(w, size * 0.45 + (o.sub ? 6 : 2));
  const lw = txt(w, left, PL + (o.indent || 0), o);
  if (right != null) { const rw = txt(w, right, PR, {...o, align: "right"}); leader(w, PL + (o.indent || 0) + lw, PR - rw); }
  if (o.sub) { w.y += 4.3; txt(w, o.sub, PL + (o.indent || 0), {size: 9, color: MUTED}); }
  w.y += size * 0.42 + 2.4;
}
function hr(w){ w.doc.setDrawColor(...LINE); w.doc.setLineWidth(0.3); w.doc.line(PL, w.y - 2.5, PR, w.y - 2.5); w.y += 2; }
function pdfHeader(w, sub){
  txt(w, "Zestawienie prowizji", PL, {bold: true, size: 20, color: ACC}); w.y += 7.5;
  if ((state.person || "").trim()) {
    const lw = txt(w, "Prowizja dla: ", PL, {size: 12, color: MUTED});
    txt(w, state.person.trim(), PL + lw, {bold: true, size: 12}); w.y += 6.5;
  }
  txt(w, sub, PL, {size: 10.5, color: MUTED});
  txt(w, "Wygenerowano " + fmtDate(today()), PR, {size: 10.5, color: MUTED, align: "right"}); w.y += 5;
  txt(w, `Prowizja ${fmtRate(state.rate) || "0"}% ${BASE_TXT[state.base]}`, PL, {size: 10.5, color: MUTED}); w.y += 8;
  hr(w); w.y += 2;
}
function pdfClientBlock(w, c){
  const r = calc(c), rate = fmtRate(state.rate) || "0";
  const items = c.costs.filter(k => k.value || (k.kind === "hours" && (k.hours || k.rate)));
  ensure(w, Math.min(240, 95 + items.reduce((h, k) => h + (costDetail(k) ? 11 : 7), 0) + (c.what.trim() ? 7 : 0)));
  txt(w, c.name.trim() || "Bez nazwy", PL, {bold: true, size: 15});
  if (c.date) txt(w, "Data faktury: " + fmtDate(c.date), PR, {size: 10, color: MUTED, align: "right"});
  w.y += 8.7;
  if (c.what.trim()) {
    w.doc.setFontSize(10.5);
    w.doc.splitTextToSize(c.what.trim(), PR - PL).forEach(l => row(w, l, null, {size: 10.5, color: MUTED}));
  }
  w.y += 2;
  row(w, "Faktura netto", fmt(r.net) + " zł");
  row(w, `VAT ${c.vat}%`, fmt(round2(r.gross - r.net)) + " zł", {color: MUTED});
  row(w, "Faktura brutto", fmt(r.gross) + " zł");
  w.y += 2;
  row(w, "Koszty", null, {bold: true});
  if (!items.length) row(w, "brak kosztów", null, {indent: 4, color: MUTED});
  items.forEach(k => row(w, k.name.trim() || "Koszt", fmt(k.value || 0) + " zł", {indent: 4, sub: costDetail(k) || null}));
  row(w, "Koszty razem", fmt(r.costs) + " zł", {bold: true});
  w.y += 2; hr(w);
  if (r.minusCost) {
    row(w, `Faktura ${r.useGross ? "brutto" : "netto"}`, fmt(r.start) + " zł");
    row(w, "minus koszty", "− " + fmt(r.costs) + " zł");
    row(w, "Podstawa prowizji", fmt(r.base) + " zł", {bold: true});
  } else {
    row(w, `Podstawa prowizji (faktura ${r.useGross ? "brutto" : "netto"})`, fmt(r.start) + " zł", {bold: true});
  }
  w.y += 1;
  row(w, `Twoja prowizja ${rate}%`, fmt(r.com) + " zł", {bold: true, size: 15, color: ACC});
}
const safeName = s => (s || "").replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, " ").trim().slice(0, 60);
async function pdfClient(c){
  const w = newDoc();
  pdfHeader(w, "Klient: " + (c.name.trim() || "bez nazwy"));
  pdfClientBlock(w, c);
  await savePdf(w.doc, `Prowizja - ${safeName(c.name) || "klient"} - ${fmtDate(c.date || today())}.pdf`);
}
async function pdfAll(){
  const list = state.clients.filter(c => !isBlank(c));
  if (!list.length) { toast("Najpierw dodaj klienta."); return; }
  const w = newDoc(), d = w.doc;
  pdfHeader(w, `Wszyscy klienci (${list.length})`);
  const rs = list.map(calc);
  const tn = round2(rs.reduce((a, r) => a + r.net, 0)), tc = round2(rs.reduce((a, r) => a + r.costs, 0)), tp = round2(rs.reduce((a, r) => a + r.com, 0));
  const rate = fmtRate(state.rate) || "0";

  // wyróżniona suma na górze
  d.setFillColor(225, 234, 248); d.roundedRect(PL, w.y - 6, PR - PL, 15, 2, 2, "F");
  const tw1 = txt(w, "Twoja prowizja łącznie", PL + 4, {bold: true, size: 14, color: ACC});
  const tw2 = txt(w, fmt(tp) + " zł", PR - 4, {bold: true, size: 16, color: ACC, align: "right"});
  leader(w, PL + 4 + tw1, PR - 4 - tw2);
  w.y += 4.5;
  txt(w, `Faktury netto ${fmt(tn)} zł · koszty ${fmt(tc)} zł`, PL + 4, {size: 9, color: MUTED});
  w.y += 12;

  const X = {net: 120, cost: 155};
  const head = () => {
    txt(w, "Klient", PL, {bold: true, size: 9.5, color: MUTED});
    txt(w, "Netto", X.net, {bold: true, size: 9.5, color: MUTED, align: "right"});
    txt(w, "Koszty", X.cost, {bold: true, size: 9.5, color: MUTED, align: "right"});
    txt(w, "Prowizja", PR, {bold: true, size: 9.5, color: MUTED, align: "right"});
    w.y += 4.5; hr(w); w.y += 1.5;
  };
  head();
  list.forEach((c, i) => {
    const r = rs[i];
    const items = c.costs.filter(k => k.value || (k.kind === "hours" && (k.hours || k.rate)));
    const sub = [c.what.trim(), c.date ? fmtDate(c.date) : ""].filter(Boolean).join(" · ");
    d.setFontSize(9);
    const subLines = sub ? d.splitTextToSize(sub, 120).slice(0, 2) : [];
    const h = 5 + 4.6 + subLines.length * 4 + (subLines.length ? 0.5 : 0) + items.length * 4.5 + 4.5;
    if (w.y - 5 + h > PBOT) { d.addPage(); w.y = 20; head(); }
    // naprzemienne tło wierszy (zebra)
    if (i % 2 === 0) { d.setFillColor(237, 243, 251); d.rect(PL - 3, w.y - 5, PR - PL + 6, h, "F"); }
    d.setFontSize(11.5); d.setFont("K", "bold");
    const nw = txt(w, d.splitTextToSize(c.name.trim() || "Bez nazwy", 80)[0], PL, {bold: true, size: 11.5});
    const vw = txt(w, fmt(r.net), X.net, {size: 11, align: "right"});
    leader(w, PL + nw, X.net - vw);
    txt(w, fmt(r.costs), X.cost, {size: 11, align: "right"});
    txt(w, fmt(r.com) + " zł", PR, {bold: true, size: 11.5, color: ACC, align: "right"});
    w.y += 4.6;
    subLines.forEach(l => { txt(w, l, PL, {size: 9, color: MUTED}); w.y += 4; });
    if (subLines.length) w.y += 0.5;
    items.forEach(k => {
      const det = costDetail(k);
      d.setFontSize(9);
      const kw = txt(w, d.splitTextToSize((k.name.trim() || "Koszt") + (det ? "  ·  " + det : ""), 110)[0], PL + 4, {size: 9, color: MUTED});
      const kv = txt(w, fmt(k.value || 0), X.cost, {size: 9, color: MUTED, align: "right"});
      leader(w, PL + 4 + kw, X.cost - kv);
      w.y += 4.5;
    });
    const calcTxt = r.minusCost
      ? `Prowizja: (${fmt(r.start)} − ${fmt(r.costs)}) × ${rate}% = ${fmt(r.com)} zł`
      : `Prowizja: ${fmt(r.start)} × ${rate}% = ${fmt(r.com)} zł`;
    txt(w, calcTxt + (r.useGross ? " (od brutto)" : ""), PL + 4, {size: 9, color: ACC});
    w.y += 4.5 + 5;
  });
  if (w.y + 12 > PBOT) { d.addPage(); w.y = 20; }
  w.y -= 2; hr(w); w.y += 2;
  const rw1 = txt(w, "Razem", PL, {bold: true, size: 12});
  const rw2 = txt(w, fmt(tn), X.net, {bold: true, size: 12, align: "right"});
  leader(w, PL + rw1, X.net - rw2);
  txt(w, fmt(tc), X.cost, {bold: true, size: 12, align: "right"});
  txt(w, fmt(tp) + " zł", PR, {bold: true, size: 12, color: ACC, align: "right"});
  await savePdf(w.doc, `Zestawienie prowizji - ${fmtDate(today())}.pdf`);
}
async function savePdf(doc, filename){
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFont("K", "normal"); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
    doc.text("© 2026 Wojciech Wieczorek", PL, 290);
    if (n > 1) doc.text(`Strona ${i} z ${n}`, PR, 290, {align: "right"});
  }
  const inClaude = !!window.claude?.use;
  if (!inClaude) { doc.save(filename); toast("PDF pobrany"); return; }
  let dl = null;
  try { dl = await claude.use("downloads"); } catch(e){}
  if (!dl) { toast("W tym widoku nie da się pobierać plików."); return; }
  try {
    await dl.save({filename, data: doc.output("blob")});
    toast("PDF zapisany");
  } catch(e){
    toast(e?.code === "declined" ? "Anulowano zapisywanie PDF." : "Nie udało się zapisać PDF. Spróbuj ponownie za chwilę.");
  }
}

/* ---------- zdarzenia ---------- */
document.getElementById("list").addEventListener("click", e => {
  if (e.target.closest('[data-act="clearall"]')) {
    clearTimeout(sureClearTimer);
    if (!sureClear) { sureClear = true; renderMain(); sureClearTimer = setTimeout(() => { sureClear = false; renderMain(); }, 5000); return; }
    sureClear = false; state.clients = []; changed(); renderMain();
    const c = newClient(); state.clients.unshift(c); openEditor(c.id, true);
    return;
  }
  if (e.target.closest('[data-act="pdfall"]')) return runPdf(pdfAll);
  const pb = e.target.closest("[data-pdf]");
  if (pb) { const c = state.clients.find(x => x.id === pb.dataset.pdf); if (c) runPdf(() => pdfClient(c)); return; }
  const b = e.target.closest("[data-open]"); if (b) openEditor(b.dataset.open);
});
document.getElementById("addBtn").addEventListener("click", () => {
  const c = newClient(); state.clients.unshift(c); openEditor(c.id, true);
});
document.getElementById("rate").addEventListener("input", e => { state.rate = parseNum(e.target.value); const v = e.target.value; renderMain(); e.target.value = v; changed(); });
document.getElementById("base").addEventListener("change", e => { state.base = e.target.value; renderMain(); changed(); });
document.getElementById("person").addEventListener("input", e => { state.person = e.target.value; renderPerson(); changed(); });
document.getElementById("vatDefault").addEventListener("change", e => { state.vat = Number(e.target.value); changed(); });

const sheet = document.getElementById("sheet");
sheet.addEventListener("input", e => {
  const t = e.target, c = cur(); if (!c) return;
  if (t.hasAttribute("data-money") || t.hasAttribute("data-num")) liveMoney(t);
  const f = t.dataset.f, cf = t.dataset.cf;
  if (f === "name" || f === "what" || f === "date") c[f] = t.value;
  else if (f === "amount") c.amount = parseNum(t.value);
  else if (cf) {
    const k = c.costs.find(x => x.id === t.closest(".cost").dataset.cost); if (!k) return;
    if (cf === "name") k.name = t.value;
    else if (cf === "hours" || cf === "rate") {
      k[cf] = parseNum(t.value); k.value = round2((k.hours || 0) * (k.rate || 0));
      t.closest(".cost").querySelector('[data-out="hsum"]').textContent = fmt(k.value) + " zł";
    }
    else k.value = parseNum(t.value);
  } else return;
  refreshForm(); changed();
});
sheet.addEventListener("focusout", e => {
  const t = e.target;
  if (t.hasAttribute && t.hasAttribute("data-money") && t.value.trim()) t.value = fmtIn(parseNum(t.value));
});
sheet.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  const all = [...sheet.querySelectorAll("#form input, #form textarea")];
  const i = all.indexOf(e.target);
  if (i > -1 && all[i + 1]) { e.preventDefault(); all[i + 1].focus(); }
});
sheet.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, c = cur();
  if (act !== "del") sureDelete = false;
  if (act === "close") return closeEditor();
  if (act === "pdf" && c) return runPdf(() => pdfClient(c));
  if (!c) return;
  if (act === "type") {
    const a = amounts(c);
    c.amountType = b.dataset.v; c.amount = b.dataset.v === "brutto" ? a.gross : a.net;
    renderForm(); changed(); return;
  }
  if (act === "vat") {
    c.vat = Number(b.dataset.v); renderForm(); changed(); return;
  }
  if (act === "addcost") {
    const k = newCost(b.dataset.name);
    c.costs.push(k); renderForm(); changed();
    sheet.querySelector(`.cost[data-cost="${k.id}"] input[data-cf="${k.kind === "hours" ? "hours" : k.name ? "value" : "name"}"]`)?.focus();
    return;
  }
  if (act === "delcost") { c.costs = c.costs.filter(k => k.id !== b.closest(".cost").dataset.cost); renderForm(); changed(); return; }
  if (act === "dup") {
    const n = JSON.parse(JSON.stringify(c)); n.id = uid(); n.name = c.name ? c.name + " (kopia)" : ""; n.date = today();
    n.costs.forEach(k => k.id = uid());
    state.clients.unshift(n); changed(); openEditor(n.id, true); return;
  }
  if (act === "del") {
    if (sureDelete) { state.clients = state.clients.filter(x => x !== c); editId = null; sureDelete = false; changed(); closeEditor(); }
    else { sureDelete = true; renderForm(); }
  }
});

/* ---------- start: od razu pusty formularz, jeśli nie ma klientów ---------- */
(function init(){
  let s = null;
  try { const raw = localStorage.getItem(LS_KEY); if (raw) s = JSON.parse(raw); } catch(e){}
  state = normalize(s);
  state.clients = state.clients.filter(c => !isBlank(c));
  renderMain();
  if (!state.clients.length) { const c = newClient(); state.clients.unshift(c); openEditor(c.id, true); }
  connectDb();
})();
</script>
